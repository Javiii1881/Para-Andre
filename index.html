<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para André ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e24, #2a2a36);
      color: #f4f4f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      max-width: 600px;
      width: 90%;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: #e0aaff;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .fecha {
      font-size: 1.1rem;
      color: #c77dff;
      margin-bottom: 25px;
      font-style: italic;
    }

    .subtitulo {
      font-size: 1.4rem;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #7b2cbf;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(123, 44, 191, 0.4);
    }

    .btn:hover {
      background-color: #9d4edd;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(157, 78, 221, 0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Para André</h1>
    <div class="fecha">18 de septiembre de 2026</div>
    <div class="subtitulo">Feliz cumpleaños André</div>
    <button class="btn" onclick="alert('¡Pronto añadiremos la clave y los casilleros!')">ENTRAR</button>
  </div>

</body>
</html>
